<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>TravelPlanner</title>
<meta name="description" content="Organizador personal de viajes: vuelos, hoteles, itinerario, gastos y más." />

<script>
  // Marca de "ya arrancó en esta sesión" — se guarda en sessionStorage
  // (vive mientras la pestaña/app siga abierta; desaparece si se cierra
  // del todo). Si ya estaba puesta, es que esto NO es el primer arranque
  // real: es una recarga del documento a medio uso (p. ej. un "atrás" del
  // sistema que termina recargando la página en vez de navegar dentro de
  // la SPA). En ese caso añadimos esta clase ANTES de que el body llegue
  // a pintarse, así el CSS oculta la bienvenida sin que llegue a verse ni
  // un frame — el arranque se siente instantáneo en vez de repetir la
  // animación de bienvenida cada vez.
  try {
    if (sessionStorage.getItem("tp_booted")) {
      document.documentElement.classList.add("tp-skip-splash");
    }
  } catch (e) {}

  // Idioma para el splash/arranque, ANTES de que cargue ningún módulo
  // (js/i18n.js hace exactamente esta misma detección para el resto
  // de la app, pero eso tarda un poco en IndexedDB — aquí solo hace
  // falta el texto de dos frases, así que se resuelve aparte y al
  // instante para que no se vean en español un frame y luego cambien
  // de golpe). Respeta el idioma elegido a mano en Ajustes si ya se
  // guardó antes (setLanguage() en i18n.js escribe aquí también,
  // como caché de solo lectura rápida); si no, detecta el del
  // dispositivo.
  try {
    var SUPPORTED_LANGS = ["es", "en", "pt", "zh", "ar"];
    var lang = localStorage.getItem("tp_lang_cache");
    if (!lang || SUPPORTED_LANGS.indexOf(lang) === -1) {
      var devLangs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "es"]);
      lang = "es";
      for (var i = 0; i < devLangs.length; i++) {
        var code = String(devLangs[i]).slice(0, 2).toLowerCase();
        if (SUPPORTED_LANGS.indexOf(code) !== -1) { lang = code; break; }
      }
    }
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    window.__TP_BOOT_STRINGS = {
      es: { tag: "Tu próximo viaje, organizado", loading: "Cargando TravelPlanner…" },
      en: { tag: "Your next trip, organized", loading: "Loading TravelPlanner…" },
      pt: { tag: "Sua próxima viagem, organizada", loading: "Carregando o TravelPlanner…" },
      zh: { tag: "让下一次旅行井井有条", loading: "TravelPlanner 加载中…" },
      ar: { tag: "رحلتك القادمة، منظَّمة", loading: "جارٍ تحميل TravelPlanner…" },
    }[lang];
  } catch (e) {}
</script>

<!-- Instalable en el iPhone/Android (Añadir a pantalla de inicio) -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#eef3ff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TravelPlanner" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="css/styles.css" />

<!-- Leaflet: mapa interactivo (OpenStreetMap, gratis, sin API key) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- SortableJS: reordenar listas arrastrando -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<!-- jsPDF: genera el PDF del mapa (sección Mapa → "Guardar en PDF") -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>
<body>

<!-- Fondo decorativo "atmósfera": una foto de cielo con nubes generada
     (con ruido/grano de foto real integrado en la propia imagen, no
     una ilustración vectorial ni manchas de gradiente). Una versión
     para tema claro (atardecer) y otra para oscuro (noche), ambas
     estáticas — sin animaciones. Puramente visual (aria-hidden), fija
     detrás de toda la interfaz. -->
<div class="atmos-bg" aria-hidden="true"></div>

<div id="splash-screen">
  <div class="splash-mark" aria-hidden="true">
    <svg class="splash-svg" viewBox="0 0 100 100" fill="none">
      <circle class="splash-dot splash-dot-1" cx="24.18" cy="65.58" r="1.7" fill="#fff" />
      <circle class="splash-dot splash-dot-2" cx="31.13" cy="54.38" r="2.1" fill="#fff" />
      <circle class="splash-dot splash-dot-3" cx="38.88" cy="44.88" r="2.5" fill="#fff" />
      <circle class="splash-dot splash-dot-4" cx="47.45" cy="37.1" r="3" fill="#fff" />
      <circle class="splash-dot splash-dot-5" cx="55.53" cy="31.73" r="3.6" fill="#fff" />
      <circle class="splash-dot splash-dot-6" cx="63.52" cy="27.92" r="4" fill="#fff" />
      <circle class="splash-dest" cx="78" cy="24" r="9" fill="#fff" />
      <g class="splash-plane">
        <path d="M16 0 L-14 -9 L-3 0 Z" fill="#fff" fill-opacity="0.72" />
        <path d="M16 0 L-3 0 L-14 9 Z" fill="#fff" />
      </g>
    </svg>
  </div>
  <p class="splash-tag">Tu próximo viaje, organizado</p>
</div>

<div id="app">
  <div class="view no-tabbar">
    <div class="boot-screen">
      <div class="boot-badge">🧭</div>
      <div class="boot-spinner"></div>
      <p id="boot-loading-text">Cargando TravelPlanner…</p>
    </div>
  </div>
</div>

<script>
  // Aplica los textos de arranque en el idioma detectado (ver script
  // del <head>) ANTES de que el navegador pinte — así nunca se ve un
  // frame en español seguido de un salto al idioma real.
  try {
    var bootStrings = window.__TP_BOOT_STRINGS;
    if (bootStrings) {
      var tagEl = document.querySelector(".splash-tag");
      if (tagEl) tagEl.textContent = bootStrings.tag;
      var loadingEl = document.getElementById("boot-loading-text");
      if (loadingEl) loadingEl.textContent = bootStrings.loading;
    }
  } catch (e) {}
</script>

<script type="module" src="js/main.js"></script>
<script>
  // Se marca la sesión como "ya arrancada" de inmediato (no hace falta
  // esperar los 2s de la animación): así, si el documento se recarga
  // por cualquier motivo mientras la app sigue abierta, la próxima
  // carga se detecta como recarga (ver script del <head>) y no como
  // primer arranque. La marca solo desaparece si se cierra la pestaña
  // o la app del todo, que es cuando sí queremos ver la bienvenida.
  try { sessionStorage.setItem("tp_booted", "1"); } catch (e) {}

  // Bienvenida: se ve ~1s y se desvanece sola. No depende de si la
  // app ya ha terminado de cargar (eso sigue su curso por su lado,
  // debajo del splash) — es puramente decorativo. Si ya se detectó
  // que es una recarga (tp-skip-splash), ni se anima ni se espera:
  // se retira al instante.
  if (document.documentElement.classList.contains("tp-skip-splash")) {
    var splashNow = document.getElementById("splash-screen");
    if (splashNow) splashNow.remove();
  } else {
    setTimeout(function () {
      var splash = document.getElementById("splash-screen");
      if (!splash) return;
      splash.classList.add("splash-hide");
      setTimeout(function () { splash.remove(); }, 500);
    }, 2000);
  }
</script>
</body>
</html>
