<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>TravelPlanner</title>
<meta name="description" content="Organizador personal de viajes: vuelos, hoteles, itinerario, gastos y más." />

<!-- Instalable en el iPhone/Android (Añadir a pantalla de inicio) -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#f6f7fb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TravelPlanner" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />

<link rel="stylesheet" href="styles.css" />

<!-- Leaflet: mapa interactivo (OpenStreetMap, gratis, sin API key) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- SortableJS: reordenar listas arrastrando -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
<div id="splash-screen">
  <img src="logo-splash.png" alt="TravelPlanner" class="splash-logo" />
  <p class="splash-tag">Tu próximo viaje, organizado</p>
</div>

<div id="app">
  <div class="view no-tabbar">
    <div class="boot-screen">
      <div class="boot-badge">🧭</div>
      <div class="boot-spinner"></div>
      <p>Cargando TravelPlanner…</p>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
<script>
  // Bienvenida: se ve ~1s y se desvanece sola. No depende de si la
  // app ya ha terminado de cargar (eso sigue su curso por su lado,
  // debajo del splash) — es puramente decorativo.
  setTimeout(function () {
    var splash = document.getElementById("splash-screen");
    if (!splash) return;
    splash.classList.add("splash-hide");
    setTimeout(function () { splash.remove(); }, 500);
  }, 1000);
</script>
</body>
</html>
